<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101010" />
  <title>용돈 탐정 사무소</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #00d992;
      --green-soft: #2fd6a1;
      --bg: #101010;
      --surface: #1a1a1a;
      --text: #f2f2f2;
      --white: #ffffff;
      --body: #bdbdbd;
      --muted: #8b949e;
      --line: #3d3a39;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Nunito", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 50% -20%, rgba(0, 217, 146, .08), transparent 34%),
        var(--bg);
    }


    /* Kawaii detective decorations */
    .detective-scene {
      position: relative;
      min-height: 190px;
      margin-top: 28px;
      overflow: hidden;
      border: 1px solid rgba(0, 217, 146, .16);
      border-radius: 18px;
      background:
        radial-gradient(circle at 20% 40%, rgba(0, 217, 146, .10), transparent 26%),
        radial-gradient(circle at 80% 70%, rgba(255, 196, 72, .08), transparent 24%),
        #141414;
    }

    .detective {
      position: absolute;
      left: 20px;
      bottom: -3px;
      width: 118px;
      height: 145px;
      z-index: 2;
    }

    .detective .hat {
      position: absolute;
      top: 2px;
      left: 16px;
      width: 88px;
      height: 34px;
      border-radius: 48% 48% 35% 35%;
      background: #b8783e;
      border: 3px solid #6d4528;
      transform: rotate(-5deg);
    }

    .detective .hat::after {
      content: "";
      position: absolute;
      left: -8px;
      bottom: -7px;
      width: 103px;
      height: 16px;
      border-radius: 50%;
      background: #9c6335;
      border: 3px solid #6d4528;
    }

    .detective .head {
      position: absolute;
      top: 29px;
      left: 25px;
      width: 70px;
      height: 72px;
      border-radius: 45% 45% 48% 48%;
      background: #f3c59f;
      border: 3px solid #4b3326;
    }

    .detective .hair {
      position: absolute;
      top: 27px;
      left: 22px;
      width: 76px;
      height: 40px;
      border-radius: 48% 48% 35% 35%;
      background: #3b2925;
      z-index: 3;
    }

    .detective .eye {
      position: absolute;
      top: 62px;
      width: 8px;
      height: 11px;
      border-radius: 50%;
      background: #201b1a;
      z-index: 4;
    }

    .detective .eye.left { left: 43px; }
    .detective .eye.right { left: 70px; }

    .detective .smile {
      position: absolute;
      left: 51px;
      top: 81px;
      width: 18px;
      height: 9px;
      border-bottom: 3px solid #7d493b;
      border-radius: 50%;
      z-index: 4;
    }

    .detective .coat {
      position: absolute;
      left: 20px;
      top: 92px;
      width: 82px;
      height: 54px;
      border-radius: 20px 20px 10px 10px;
      background: #a86e3f;
      border: 3px solid #4b3326;
    }

    .detective .magnifier {
      position: absolute;
      left: 77px;
      top: 50px;
      width: 42px;
      height: 42px;
      border: 7px solid var(--green);
      border-radius: 50%;
      background: rgba(125, 220, 255, .20);
      box-shadow: 0 0 12px rgba(0, 217, 146, .32);
      z-index: 6;
    }

    .detective .magnifier::after {
      content: "";
      position: absolute;
      right: -19px;
      bottom: -14px;
      width: 25px;
      height: 8px;
      border-radius: 99px;
      background: #74482c;
      transform: rotate(48deg);
    }

    .money,
    .math {
      position: absolute;
      z-index: 1;
      user-select: none;
      pointer-events: none;
    }

    .money {
      color: #f4c542;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(244, 197, 66, .22);
    }

    .money.coin {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 3px solid #d89d23;
      border-radius: 50%;
      background: #f4c542;
      color: #8b5c11;
      font-size: 16px;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.18);
    }

    .math {
      color: var(--green);
      font-size: 20px;
      font-weight: 800;
      opacity: .82;
    }

    .m1 { top: 19px; right: 23px; }
    .m2 { top: 88px; right: 120px; }
    .m3 { bottom: 20px; right: 28px; }
    .m4 { top: 42px; left: 155px; }
    .m5 { bottom: 26px; left: 145px; }

    .coin1 { top: 24px; right: 160px; transform: rotate(-12deg); }
    .coin2 { bottom: 22px; right: 155px; transform: rotate(9deg); }
    .coin3 { top: 82px; left: 180px; transform: rotate(14deg); }

    .money-bag {
      position: absolute;
      right: 25px;
      bottom: 12px;
      font-size: 47px;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,.25));
    }

    .case-note {
      position: absolute;
      top: 17px;
      left: 19px;
      padding: 8px 12px;
      border: 1px dashed rgba(0,217,146,.38);
      border-radius: 9px;
      color: var(--body);
      background: rgba(16,16,16,.68);
      font-size: 11px;
      font-weight: 800;
      transform: rotate(-2deg);
    }

    .case-note b {
      color: var(--green);
    }

    /* Header */
    .header {
      height: 72px;
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 16, 16, .94);
      backdrop-filter: blur(14px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--white);
      text-decoration: none;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: #101010;
      background: var(--green);
      border-radius: 10px;
      font-size: 19px;
      box-shadow: 0 0 20px rgba(0, 217, 146, .16);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 9999px;
      color: var(--body);
      background: rgba(26, 26, 26, .72);
      font-size: 13px;
      font-weight: 700;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(0, 217, 146, .75);
    }

    /* Main */
    .main {
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(260px, 34%) minmax(0, 66%);
      gap: 28px;
      padding: 28px 32px 32px;
    }

    .intro {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px 10px 18px 8px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin-bottom: 20px;
      color: var(--green-soft);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 2px;
      border-radius: 99px;
      background: var(--green);
    }

    h1 {
      max-width: 570px;
      margin: 0;
      color: var(--white);
      font-size: clamp(38px, 4.5vw, 64px);
      line-height: .98;
      letter-spacing: -2.2px;
      font-weight: 800;
    }

    h1 .accent {
      color: var(--green);
    }

    .description {
      max-width: 500px;
      margin: 22px 0 0;
      color: var(--body);
      font-size: 17px;
      line-height: 1.75;
      font-weight: 500;
    }

    .tips {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 28px;
    }

    .tip {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 9999px;
      color: var(--body);
      background: var(--surface);
      font-size: 12px;
      font-weight: 700;
    }

    .tip.green {
      color: var(--green-soft);
      border-color: rgba(0, 217, 146, .3);
    }

    /* Chat */
    .chat-card {
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow:
        0 0 0 1px rgba(0, 217, 146, .025),
        0 0 30px rgba(0, 217, 146, .045);
    }

    .chat-top {
      height: 54px;
      flex: 0 0 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 17px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    .chat-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--green);
      color: #101010;
      font-size: 14px;
    }

    .minimize {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 5px;
    }

    .minimize:hover {
      color: var(--green);
    }

    .iframe-wrap {
      min-height: 0;
      flex: 1;
      background: var(--bg);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }

    /* Footer */
    .footer {
      height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2px;
    }

    /* Mobile */
    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100vh;
        height: auto;
      }

      .header {
        height: 64px;
        flex-basis: 64px;
        padding: 0 18px;
      }

      .main {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(520px, 1fr);
        padding: 22px 14px 14px;
        gap: 18px;
      }

      .intro {
        justify-content: flex-start;
        padding: 8px 5px 0;
      }

      h1 {
        font-size: clamp(39px, 11vw, 54px);
        letter-spacing: -1.7px;
      }

      .description {
        margin-top: 16px;
        font-size: 15px;
        line-height: 1.65;
      }

      .tips {
        margin-top: 18px;
      }


      .detective-scene {
        min-height: 165px;
        margin-top: 20px;
      }

      .detective {
        transform: scale(.9);
        transform-origin: left bottom;
      }

      .chat-card {
        min-height: 520px;
      }

      .footer {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .brand {
        font-size: 18px;
      }

      .brand-mark {
        width: 31px;
        height: 31px;
      }

      .status {
        padding: 6px 9px;
        font-size: 11px;
      }

      .status-text {
        display: none;
      }

      .main {
        padding: 18px 10px 10px;
      }

      .chat-card {
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <a class="brand" href="#" aria-label="용돈 탐정 사무소 홈">
        <span class="brand-mark">🔎</span>
        <span>용돈 탐정 사무소</span>
      </a>

      <div class="status">
        <span class="status-dot"></span>
        <span class="status-text">AI Assistant Online</span>
      </div>
    </header>

    <main class="main">

      <section class="intro">
        <div class="eyebrow">AI AGENT</div>

        <h1>
          <span class="accent">용돈 탐정 사무소</span><br>
          사건을 해결해봐요!
        </h1>

        <p class="description">
          나만의 AI Assistant와 대화해보세요.
          어려운 것도 쉽게, 복잡한 것도 귀엽고 편하게
          하나씩 해결해드릴게요. ✨
        </p>

        <div class="tips">
          <span class="tip green">● 실시간 AI</span>
          <span class="tip">무엇이든 질문</span>
          <span class="tip">편한 대화</span>
        </div>

        <div class="detective-scene" aria-label="귀여운 탐정과 돈, 수학기호 장식">
          <div class="case-note">CASE <b>#001</b> · 용돈의 비밀을 찾아라!</div>

          <div class="math m1">÷ + ×</div>
          <div class="math m2">Σ x²</div>
          <div class="math m3">₩ + $</div>
          <div class="math m4">= ?</div>
          <div class="math m5">%</div>

          <div class="money coin coin1">₩</div>
          <div class="money coin coin2">$</div>
          <div class="money coin coin3">₩</div>
          <div class="money-bag">💰</div>

          <div class="detective" aria-hidden="true">
            <div class="hat"></div>
            <div class="hair"></div>
            <div class="head"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="smile"></div>
            <div class="coat"></div>
            <div class="magnifier"></div>
          </div>
        </div>
      </section>

      <section class="chat-card" aria-label="AI Assistant">
        <div class="chat-top">
          <div class="chat-title">
            <span class="chat-icon">✦</span>
            <span>AI Assistant</span>
          </div>

          <button class="minimize" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="위로 이동">
            ···
          </button>
        </div>

        <div class="iframe-wrap">
          <iframe
            src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_agent1_nGJFxB/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
            title="용돈 탐정 사무소"
            allow="microphone"
            loading="eager">
          </iframe>
        </div>
      </section>

    </main>

    <footer class="footer">
      AI와 함께 용돈의 비밀을 찾아보세요 🔎
    </footer>

  </div>
</body>
</html>
